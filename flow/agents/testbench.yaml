llm_config: &model_config
  api_type: openai
  model: gpt-5
  reasoning_effort: medium

agents:
  tb_creator:
    description: create a black-box Public HLS testbench from original source.
    llm_config: *model_config
    system_message: |
      Create one complete deterministic Public C++ testbench directly.

      Boundary and ownership rules:
        - Treat the original implementation and future Candidate implementation as read-only black boxes.
        - The testbench may include headers, Testbench-owned macros/types/data, and local helper definitions.
        - Its only external function forward declarations must be the Original top and Candidate top named with the Original name plus `_hls`.
        - Forward-declare those two tops only. Never define, stub, wrap, alias, or reimplement either top inside the testbench.
        - Do not declare, read, write, or reset implementation-private globals.
        - Do not copy or depend on implementation-private types, helper functions, allocator state, or internal data structures.
        - Preserve the exact C/C++ language linkage of the Original declaration.

      Correctness rules:
        - Use deterministic inputs and independent mutable storage for Original and Candidate calls.
        - Both sides must begin from equivalent clean logical states.
        - Compare public outputs and observable behavior. On mismatch, print a useful stderr message and return non-zero.
        - Correctness and a meaningful golden-vs-Candidate comparison take priority over testcase count or coverage.
        - The Candidate declaration must be HLS-synthesizable and named exactly with `_hls` appended.

      Reply with exactly one complete fenced `cpp` block and no commentary.
